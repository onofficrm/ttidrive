name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        run: |
          missing=0
          [ -z "${{ secrets.SERVER_HOST }}" ] && echo "::error::SERVER_HOST secret이 없습니다" && missing=1
          [ -z "${{ secrets.SERVER_USER }}" ] && echo "::error::SERVER_USER secret이 없습니다" && missing=1
          [ -z "${{ secrets.SERVER_PASSWORD }}" ] && echo "::error::SERVER_PASSWORD secret이 없습니다 (FTP 비밀번호 등록 필요)" && missing=1
          [ -z "${{ secrets.SERVER_PORT }}" ] && echo "::error::SERVER_PORT secret이 없습니다" && missing=1
          [ "$missing" -eq 1 ] && exit 1
          echo "Deployment secrets 확인 완료"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          state-name: ttidrive-deploy-v1
          log-level: minimal
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            _backup_transfer_*/
            **/_backup_transfer_*/
            _BUILDER_INPUT/**
            data/**
            cache/**
            session/**
            tmp/**
            *.log
            .env
            .env.*
