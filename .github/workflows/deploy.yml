name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        run: |
          missing=0
          [ -z "${{ secrets.SERVER_HOST }}" ] && echo "::error::SERVER_HOST secret이 없습니다" && missing=1
          [ -z "${{ secrets.SERVER_USER }}" ] && echo "::error::SERVER_USER secret이 없습니다" && missing=1
          [ -z "${{ secrets.SERVER_SSH_KEY }}" ] && echo "::error::SERVER_SSH_KEY secret이 없습니다" && missing=1
          [ "$missing" -eq 1 ] && exit 1
          echo "Deployment secrets 확인 완료"

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via rsync over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?Missing SERVER_HOST secret}"
          : "${SERVER_USER:?Missing SERVER_USER secret}"

          PORT="${SERVER_PORT:-22}"
          REMOTE="${SERVER_USER}@${SERVER_HOST}:~/public_html/"

          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz --delete \
            -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude '.vscode/' \
            --exclude '._*' \
            --exclude '_BUILDER_INPUT/' \
            --exclude 'data/' \
            --exclude 'cache/' \
            --exclude 'session/' \
            --exclude 'tmp/' \
            --exclude '*.log' \
            --exclude '.env' \
            --exclude '.env.*' \
            ./ "$REMOTE"
